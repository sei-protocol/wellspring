# One replica with Recreate on purpose: one signer owns the nonce, and two pods
# sending from the same key pay claims twice. The security contexts are fixed
# rather than values, so a deployment cannot loosen them.
{{- $captcha := include "wellspring.captchaSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wellspring.fullname" . }}
  labels:
    {{- include "wellspring.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wellspring.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wellspring.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "wellspring.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wellspring
          image: {{ include "wellspring.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: {{ include "wellspring.fullname" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: signer
              mountPath: /var/run/wellspring/signer
              readOnly: true
            {{- if $captcha }}
            - name: captcha
              mountPath: /var/run/wellspring/captcha
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wellspring.claimName" . }}
        - name: signer
          secret:
            secretName: {{ .Values.signer.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.signer.key }}
                path: private-key
        {{- if $captcha }}
        - name: captcha
          secret:
            secretName: {{ $captcha }}
            defaultMode: 0440
            items:
              - key: {{ .Values.captcha.key }}
                path: secret
        {{- end }}
