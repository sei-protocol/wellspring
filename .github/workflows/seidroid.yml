name: seidroid review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  seidroid:
    # A pull_request run from a fork gets no OIDC token, which the review needs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: sei-protocol/seidroid/.github/workflows/review.yml@c9706feea6d1ff72e9457a66786b2adfac2fd068 # v0.3.3
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      shadow: false
      approve-on-success: true
      allowed-bots: seidroid[bot]
      # Unset reads REVIEW.md, which this repository does not keep.
      guidelines-file: AGENTS.md
      # The review's sandbox has no network, and the runner's Go may be older
      # than go.mod's, so install that version into the sandbox's home and
      # fetch the modules first.
      prepare: >-
        v=$(awk '$1 == "go" {print $2 ~ /^[0-9]+\.[0-9]+$/ ? $2 ".0" : $2; exit}' go.mod) &&
        mkdir -p ~/sdk &&
        curl --proto '=https' --tlsv1.2 -fsSL "https://go.dev/dl/go$v.linux-$(dpkg --print-architecture).tar.gz" |
        tar -xzC ~/sdk &&
        ~/sdk/go/bin/go mod download
      extra-instructions: >-
        Go is in ~/sdk/go/bin, which is not on PATH, and the modules are
        already downloaded, as there is no network; run
        `export PATH="$HOME/sdk/go/bin:$PATH" GOPROXY=off` before using go.
        Build with `go build ./...`, test with `go test -race -count=1 ./...`,
        and check `go vet ./...`, `go vet -tags e2e ./e2e` and `gofmt -l .`.
        The e2e tests need a live node and golangci-lint needs the network,
        so leave both to CI.
